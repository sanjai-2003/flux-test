apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: erpnext
  namespace: erpnext
spec:
  chart:
    spec:
      chart: erpnext
      version: 2.0.11
      sourceRef:
        kind: HelmRepository
        name: frappe
        namespace: flux-system
  interval: 5m
  install:
    createNamespace: true
  values:
    - https://raw.githubusercontent.com/VeryStrongFingers/erpnext-k3s/master/helm-charts/erpnext-values.yaml

